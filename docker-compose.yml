services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuzultech-web
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
