version: '3.8'

services:
  nuzultech-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuzultech_web_prod
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - nuzultech-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  nuzultech-network:
    driver: bridge
